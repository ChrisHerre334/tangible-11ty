<!DOCTYPE html>
<html>

<head>
  <title>TIBBL</title>
  <link rel="stylesheet" href="/tangible-11ty/assets/css/w3.css">

  <script src="/tangible-11ty/assets/js/topcodes.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <div id="main">
    <div id="video">
      <canvas id="video-canvas" width="480" height="700" ></canvas>
	    <div id="video-controls">
        <button id="camera-button" class="duo">Start / Stop</button>
        <button id="switch-view" class="duo">Switch View</button>
        <button id="run" type="button" class="mono">Run</button>
      </div>
    </div>
    <div class="controls">
      <h2>Sound Set</h2>
      <select name="soundSets" id="soundSets"> 
        <option value="GimmeGimmeGimme">Gimme Gimme Gimme</option> 
        <option value="EyeOfTheTiger">Eye of the Tiger</option>
        <option value="Popcorn">Popcorn</option>
        <option value="DoctorFoster">Doctor Foster</option>
        <option value="JingleBells">Jingle Bells</option>
        <option value="Limerick1">Limerick 1</option>
        <option value="Limerick2">Limerick 2</option>
        <option value="Limerick3">Limerick 3</option>
        <option value="Poem">Poem</option>
        <option value="RowYourBoat">Row Your Boat</option>
        <option value="Story">Story</option>
      </select>
    </div>
    <div class="controls">
      <h2>Challenges</h2>
      <div id="challenges" class="resultWindow"></div>
    </div>

    <!-- Custom Sound Set UI -->
    <div class="controls" id="custom-sound-set-container">
      <h2>Make Your Sound Set</h2>
      <div class="recording-scroll-containter">
        <div class="recording-scroll">
          
            <div class="recording-slot" data-letter="A">
              <div class="slot-label">A</div>
              <button class="record-button" data-letter="A">
                <svg xmlns="https://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                  <circle cx="12" cy="12" r="6" fill="#ff0000" />
                </svg>
              </button>
              <div class="progress-container">
                <div class="progress-bar" data-letter="A"></div>
              </div>
              <button class="discard-button" data-letter="A" disabled>
                <svg xmlns="https://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                  <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="#19736d"/></path>
                </svg>
              </button>
            </div>
          
            <div class="recording-slot" data-letter="B">
              <div class="slot-label">B</div>
              <button class="record-button" data-letter="B">
                <svg xmlns="https://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">

                </svg>
              </button>
            </div>
          
            <div class="recording-slot" data-letter="C">
              <div class="slot-label">C</div>
              <button class="record-button" data-letter="C">
                <svg xmlns="https://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">

              <div class="progress-container">

              </button>
            </div>
          
            <div class="recording-slot" data-letter="D">

              <button class="record-button" data-letter="I">

                </svg>

            </div>
          
            <div class="recording-slot" data-letter="J">
              <div class="slot-label">J</div>
              <button class="record-button" data-letter="J">
                <svg xmlns="https://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                  <circle cx="12" cy="12" r="6" fill="#ff0000" />
                </svg>
              </button>
              <div class="progress-container">
                <div class="progress-bar" data-letter="J"></div>
              </div>
              <button class="discard-button" data-letter="J" disabled>
                <svg xmlns="https://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                  <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="#19736d"/></path>
                </svg>
              </button>
            </div>
          
        </div>
      </div>
      <div class="bottom-actions">
        <button id="submit-sound-set" class="mono">Save Sound Set</button>
      </div>
    </div>

    <div id="output">
      <h2>Result</h2>
      <div id="result" class="resultWindow"></div>
      <br/>
      <div class="w3-row">
        <h2>Codes</h2>
        <div id="codes" class="resultWindow"></div>
      </div>
    </div>
  </div>

  <script defer type="module" src="/tangible-11ty/assets/js/main.js"></script>
  <script defer type="module" src="/tangible-11ty/assets/js/sound-recorder.js"></script>

</body>

</html>
